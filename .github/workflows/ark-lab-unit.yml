name: Ark lab unit tests
on:
  push:
    paths: &ark_paths
      - 'ark/**'
      - 'scripts/ark/**'
      - 'docs/ark/**'
      - 'deploy/ark/**'
      - '.github/workflows/ark-lab-unit.yml'
  pull_request:
    paths: *ark_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ark-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Ark Rust SDK image (offline locked verification)
        run: bash scripts/ark/docker-e2e.sh build
      - name: Run unit and contract tests inside ark-sdk container (no live services)
        run: bash scripts/ark/docker-e2e.sh unit
      - name: Build pinned Ark CI tools container (no secrets in context)
        run: bash scripts/ark/docker-ci-checks.sh build
      - name: Run bootstrap funding bash regression inside pinned container (offline, streamed inputs)
        run: bash scripts/ark/docker-ci-checks.sh bootstrap-regression --if-present
      - name: Run secret hygiene scan inside pinned container (offline, full history stream)
        run: bash scripts/ark/docker-ci-checks.sh secrets-check
