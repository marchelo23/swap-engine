name: swap-engine-ark-regtest

x-owner: &owner
  io.swap-engine.ark.worktree: "${ARK_LAB_WORKTREE}"

services:
  bitcoin:
    image: docker.io/btcpayserver/bitcoin:31.0
    container_name: ark_lab_bitcoin
    labels: *owner
    stop_grace_period: 30s
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_EXTRA_ARGS: |
        rpcbind=0.0.0.0
        rpcallowip=0.0.0.0/0
        rpcuser=ark-lab
        rpcpassword=${ARK_LAB_RPC_PASSWORD}
        dnsseed=0
        fixedseeds=0
        txindex=1
        blockfilterindex=1
        peerblockfilters=1
        fallbackfee=0.00001
        minrelaytxfee=0
        mintxfee=0
        blockmintxfee=0
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
    ports: ["127.0.0.1:38443:18443"]
    networks: [default, host_access]
    volumes: [bitcoin_data:/data]
  postgres:
    image: docker.io/library/postgres:16
    container_name: ark_lab_postgres
    labels: *owner
    environment:
      # No host port; this DB is dedicated to the internal lab network.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [postgres_data:/var/lib/postgresql/data]
  nbxplorer:
    image: docker.io/nicolasdorier/nbxplorer:2.6.7
    container_name: ark_lab_nbxplorer
    labels: *owner
    restart: on-failure
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: btc
      NBXPLORER_BTCRPCURL: http://bitcoin:18443/
      NBXPLORER_BTCNODEENDPOINT: bitcoin:18444
      NBXPLORER_BTCRPCUSER: ark-lab
      NBXPLORER_BTCRPCPASSWORD: "${ARK_LAB_RPC_PASSWORD}"
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_POSTGRES: "User ID=postgres;Host=postgres;Database=nbxplorer"
      NBXPLORER_NOAUTH: "1"
    ports: ["127.0.0.1:32838:32838"]
    networks: [default, host_access]
    volumes: [nbxplorer_data:/datadir]
  fulcrum:
    image: docker.io/cculianu/fulcrum:v2.1.1
    container_name: ark_lab_fulcrum
    labels: *owner
    restart: on-failure
    command:
      - Fulcrum
      - --bitcoind
      - bitcoin:18443
      - --rpcuser
      - ark-lab
      - --rpcpassword
      - "${ARK_LAB_RPC_PASSWORD}"
      - --tcp
      - 0.0.0.0:50001
    volumes: [fulcrum_data:/data]
  mempool_mariadb:
    image: docker.io/library/mariadb:10.5
    container_name: ark_lab_mempool_mariadb
    labels: *owner
    profiles: [debug-mempool-db]
    environment:
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: "${ARK_LAB_DB_PASSWORD}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [mariadb_data:/var/lib/mysql]
  mempool_api:
    image: docker.io/mempool/backend:v3.3.1
    container_name: ark_lab_mempool_api
    labels: *owner
    user: "1000:1000"
    init: true
    restart: on-failure
    command: "./wait-for-it.sh fulcrum:50001 --timeout=180 --strict -- ./start.sh"
    environment:
      CORE_RPC_HOST: bitcoin
      CORE_RPC_PORT: "18443"
      CORE_RPC_USERNAME: ark-lab
      CORE_RPC_PASSWORD: "${ARK_LAB_RPC_PASSWORD}"
      MEMPOOL_BACKEND: electrum
      ELECTRUM_HOST: fulcrum
      ELECTRUM_PORT: "50001"
      ELECTRUM_TLS_ENABLED: "false"
      # DB-backed indexing in this release requires public mining-pool
      # metadata at startup. The lab uses only the local Esplora API.
      DATABASE_ENABLED: "false"
      MEMPOOL_NETWORK: regtest
      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_API_URL_PREFIX: "/api/"
      MEMPOOL_CACHE_DIR: /backend/cache
      MEMPOOL_POLL_RATE_MS: "2000"
      MEMPOOL_EXTERNAL_MAX_RETRY: "0"
      STATISTICS_ENABLED: "false"
      LIGHTNING_ENABLED: "false"
    volumes: [mempool_cache:/backend/cache]
    ports: ["127.0.0.1:33000:8999"]
    networks: [default, host_access]
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ark_lab_redis
    labels: *owner
  arkd-wallet:
    image: ghcr.io/arkade-os/arkd-wallet:v0.9.25
    container_name: ark_lab_arkd_wallet
    labels: *owner
    restart: on-failure
    environment:
      ARKD_WALLET_NETWORK: regtest
      ARKD_WALLET_NBXPLORER_URL: http://nbxplorer:32838
    volumes: [wallet_data:/app/data]
  arkd-signer:
    image: ghcr.io/arkade-os/arkd-signer:v0.9.25
    container_name: ark_lab_arkd_signer
    labels: *owner
    expose: ["6061"]
    environment:
      ARKD_SIGNER_PORT: "6061"
      ARKD_SIGNER_SECRET_KEY: "${ARK_LAB_SIGNER_KEY}"
  arkd:
    image: ghcr.io/arkade-os/arkd:v0.9.25
    container_name: ark_lab_arkd
    labels: *owner
    restart: on-failure
    environment:
      ARKD_NO_TLS: "true"
      ARKD_NO_MACAROONS: "true"
      ARKD_WALLET_ADDR: arkd-wallet:6060
      ARKD_SIGNER_ADDR: arkd-signer:6061
      ARKD_ESPLORA_URL: http://mempool_api:8999/api
      ARKD_DB_TYPE: postgres
      ARKD_EVENT_DB_TYPE: postgres
      ARKD_PG_DB_URL: "postgresql://postgres@postgres:5432/projection?sslmode=disable"
      ARKD_PG_EVENT_DB_URL: "postgresql://postgres@postgres:5432/event?sslmode=disable"
      ARKD_PG_DB_AUTOCREATE: "true"
      ARKD_LIVE_STORE_TYPE: redis
      ARKD_REDIS_URL: redis://redis:6379/0
      ARKD_UNLOCKER_TYPE: env
      ARKD_UNLOCKER_PASSWORD: "${ARK_LAB_WALLET_PASSWORD}"
      ARKD_SCHEDULER_TYPE: block
      ARKD_VTXO_MIN_AMOUNT: "1"
      ARKD_ROUND_MIN_PARTICIPANTS_COUNT: "1"
      ARKD_SESSION_DURATION: "10"
      ARKD_UNILATERAL_EXIT_DELAY: "20"
      ARKD_PUBLIC_UNILATERAL_EXIT_DELAY: "20"
      ARKD_BOARDING_EXIT_DELAY: "30"
      ARKD_CHECKPOINT_EXIT_DELAY: "10"
      ARKD_VTXO_TREE_EXPIRY: "40"
      ARKD_UNROLLED_VTXO_MIN_EXPIRY_MARGIN: "10"
    ports: ["127.0.0.1:37070:7070", "127.0.0.1:37071:7071"]
    networks: [default, host_access]
    volumes: [arkd_data:/app/data]

networks:
  default:
    name: swap_engine_ark_net
    internal: true
    labels: *owner
  # Docker needs a non-internal bridge to make the loopback bindings usable.
  host_access:
    name: swap_engine_ark_host_net
    driver: bridge
    labels: *owner

volumes:
  bitcoin_data: {name: swap_engine_ark_bitcoin_data, labels: *owner}
  postgres_data: {name: swap_engine_ark_postgres_data, labels: *owner}
  nbxplorer_data: {name: swap_engine_ark_nbxplorer_data, labels: *owner}
  fulcrum_data: {name: swap_engine_ark_fulcrum_data, labels: *owner}
  mariadb_data: {name: swap_engine_ark_mariadb_data, labels: *owner}
  mempool_cache: {name: swap_engine_ark_mempool_cache, labels: *owner}
  wallet_data: {name: swap_engine_ark_wallet_data, labels: *owner}
  arkd_data: {name: swap_engine_ark_arkd_data, labels: *owner}
