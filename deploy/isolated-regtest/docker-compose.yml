name: ${ISO_RT_PROJECT_NAME:-swap-engine-iso-regtest}

x-owner: &owner
  io.swap-engine.isolated.regtest: "iso-rt"

services:
  iso_rt_bitcoin:
    image: docker.io/btcpayserver/bitcoin:31.0
    container_name: iso_rt_bitcoin
    labels: *owner
    restart: on-failure
    stop_grace_period: 30s
    entrypoint: ["bitcoind"]
    command:
      - -datadir=/root/.bitcoin
      - -regtest
      - -txindex=1
      - -blockfilterindex=1
      - -peerblockfilters=1
      - -dnsseed=0
      - -fixedseeds=0
      - -fallbackfee=0.0001
      - -minrelaytxfee=0
      - -mintxfee=0
      - -blockmintxfee=0
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -port=18444
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -rpcauth=${ISO_RT_BITCOIN_RPCAUTH:?set ISO_RT_BITCOIN_RPCAUTH}
    ports:
      - "127.0.0.1:${ISO_RT_BITCOIN_RPC_PORT:-48443}:18443"
      - "127.0.0.1:${ISO_RT_BITCOIN_P2P_PORT:-48444}:18444"
      - "127.0.0.1:${ISO_RT_BITCOIN_ZMQ_BLOCK_PORT:-48332}:28332"
      - "127.0.0.1:${ISO_RT_BITCOIN_ZMQ_TX_PORT:-48333}:28333"
    volumes:
      - ${ISO_RT_RUNTIME_DIR:?set ISO_RT_RUNTIME_DIR}/bitcoin:/root/.bitcoin
    networks: [iso_rt_net, iso_rt_host_net]

  iso_rt_lnd_provider:
    image: docker.io/lightninglabs/lnd:v0.20.8-beta
    container_name: iso_rt_lnd_provider
    labels: *owner
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      - iso_rt_bitcoin
    command:
      - lnd
      - --lnddir=/root/.lnd
      - --alias=iso-rt-provider
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=iso_rt_bitcoin:18443
      - --bitcoind.rpcuser=${ISO_RT_BITCOIN_RPC_USER:-iso-rt-rpc}
      - --bitcoind.rpcpass=${ISO_RT_BITCOIN_RPC_PASS:?set ISO_RT_BITCOIN_RPC_PASS}
      - --bitcoind.zmqpubrawblock=tcp://iso_rt_bitcoin:28332
      - --bitcoind.zmqpubrawtx=tcp://iso_rt_bitcoin:28333
      - --restlisten=0.0.0.0:8080
      - --rpclisten=0.0.0.0:10009
      - --listen=0.0.0.0:9735
      - --tlsextraip=127.0.0.1
      - --tlsextradomain=localhost
      - --tlsextradomain=iso_rt_lnd_provider
      - --protocol.wumbo-channels
    ports:
      - "127.0.0.1:${ISO_RT_LND_PROVIDER_REST_PORT:-48080}:8080"
      - "127.0.0.1:${ISO_RT_LND_PROVIDER_GRPC_PORT:-40009}:10009"
      - "127.0.0.1:${ISO_RT_LND_PROVIDER_P2P_PORT:-49735}:9735"
    volumes:
      - ${ISO_RT_RUNTIME_DIR:?set ISO_RT_RUNTIME_DIR}/lnd-provider:/root/.lnd
    networks: [iso_rt_net, iso_rt_host_net]

  iso_rt_lnd_alice:
    image: docker.io/lightninglabs/lnd:v0.20.8-beta
    container_name: iso_rt_lnd_alice
    labels: *owner
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      - iso_rt_bitcoin
    command:
      - lnd
      - --lnddir=/root/.lnd
      - --alias=iso-rt-alice
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=iso_rt_bitcoin:18443
      - --bitcoind.rpcuser=${ISO_RT_BITCOIN_RPC_USER:-iso-rt-rpc}
      - --bitcoind.rpcpass=${ISO_RT_BITCOIN_RPC_PASS:?set ISO_RT_BITCOIN_RPC_PASS}
      - --bitcoind.zmqpubrawblock=tcp://iso_rt_bitcoin:28332
      - --bitcoind.zmqpubrawtx=tcp://iso_rt_bitcoin:28333
      - --restlisten=0.0.0.0:8080
      - --rpclisten=0.0.0.0:10009
      - --listen=0.0.0.0:9735
      - --tlsextraip=127.0.0.1
      - --tlsextradomain=localhost
      - --tlsextradomain=iso_rt_lnd_alice
      - --protocol.wumbo-channels
    ports:
      - "127.0.0.1:${ISO_RT_LND_ALICE_REST_PORT:-48081}:8080"
      - "127.0.0.1:${ISO_RT_LND_ALICE_GRPC_PORT:-40010}:10009"
      - "127.0.0.1:${ISO_RT_LND_ALICE_P2P_PORT:-49736}:9735"
    volumes:
      - ${ISO_RT_RUNTIME_DIR:?set ISO_RT_RUNTIME_DIR}/lnd-alice:/root/.lnd
    networks: [iso_rt_net, iso_rt_host_net]

  iso_rt_postgres:
    image: docker.io/library/postgres:16
    container_name: iso_rt_postgres
    labels: *owner
    restart: on-failure
    command: ["postgres", "-p", "5432"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - iso_rt_postgres_data:/var/lib/postgresql/data
    networks: [iso_rt_net]

  iso_rt_redis:
    image: docker.io/library/redis:7-alpine
    container_name: iso_rt_redis
    labels: *owner
    restart: on-failure
    command: ["redis-server", "--port", "6379"]
    networks: [iso_rt_net]

  iso_rt_nbxplorer:
    image: docker.io/nicolasdorier/nbxplorer:2.6.7
    container_name: iso_rt_nbxplorer
    labels: *owner
    restart: on-failure
    depends_on:
      - iso_rt_bitcoin
      - iso_rt_postgres
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: btc
      NBXPLORER_BTCRPCURL: http://iso_rt_bitcoin:18443/
      NBXPLORER_BTCNODEENDPOINT: iso_rt_bitcoin:18444
      NBXPLORER_BTCRPCUSER: ${ISO_RT_BITCOIN_RPC_USER:-iso-rt-rpc}
      NBXPLORER_BTCRPCPASSWORD: ${ISO_RT_BITCOIN_RPC_PASS:?set ISO_RT_BITCOIN_RPC_PASS}
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_POSTGRES: "User ID=postgres;Host=iso_rt_postgres;Port=5432;Database=nbxplorer"
      NBXPLORER_NOAUTH: "1"
    ports:
      - "127.0.0.1:${ISO_RT_NBXPLORER_PORT:-42938}:32838"
    volumes:
      - iso_rt_nbxplorer_data:/datadir
    networks: [iso_rt_net, iso_rt_host_net]

  iso_rt_fulcrum:
    image: docker.io/cculianu/fulcrum:v2.1.1
    container_name: iso_rt_fulcrum
    labels: *owner
    restart: on-failure
    depends_on:
      - iso_rt_bitcoin
    command:
      - Fulcrum
      - --bitcoind
      - iso_rt_bitcoin:18443
      - --rpcuser
      - ${ISO_RT_BITCOIN_RPC_USER:-iso-rt-rpc}
      - --rpcpassword
      - ${ISO_RT_BITCOIN_RPC_PASS:?set ISO_RT_BITCOIN_RPC_PASS}
      - --tcp
      - 0.0.0.0:50001
    volumes:
      - iso_rt_fulcrum_data:/data
    networks: [iso_rt_net]

  iso_rt_mempool_api:
    image: docker.io/mempool/backend:v3.3.1
    container_name: iso_rt_mempool_api
    labels: *owner
    user: "1000:1000"
    init: true
    restart: on-failure
    depends_on:
      - iso_rt_bitcoin
      - iso_rt_fulcrum
    command: "./wait-for-it.sh iso_rt_fulcrum:50001 --timeout=180 --strict -- ./start.sh"
    environment:
      CORE_RPC_HOST: iso_rt_bitcoin
      CORE_RPC_PORT: "18443"
      CORE_RPC_USERNAME: ${ISO_RT_BITCOIN_RPC_USER:-iso-rt-rpc}
      CORE_RPC_PASSWORD: ${ISO_RT_BITCOIN_RPC_PASS:?set ISO_RT_BITCOIN_RPC_PASS}
      MEMPOOL_BACKEND: electrum
      ELECTRUM_HOST: iso_rt_fulcrum
      ELECTRUM_PORT: "50001"
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "false"
      MEMPOOL_NETWORK: regtest
      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_API_URL_PREFIX: "/api/"
      MEMPOOL_CACHE_DIR: /backend/cache
      MEMPOOL_POLL_RATE_MS: "2000"
      MEMPOOL_EXTERNAL_MAX_RETRY: "0"
      STATISTICS_ENABLED: "false"
      LIGHTNING_ENABLED: "false"
    ports:
      - "127.0.0.1:${ISO_RT_MEMPOOL_PORT:-43100}:8999"
    volumes:
      - iso_rt_mempool_cache:/backend/cache
    networks: [iso_rt_net, iso_rt_host_net]

  iso_rt_arkd_wallet:
    image: ghcr.io/arkade-os/arkd-wallet:v0.9.25
    container_name: iso_rt_arkd_wallet
    labels: *owner
    restart: on-failure
    depends_on:
      - iso_rt_nbxplorer
    environment:
      ARKD_WALLET_NETWORK: regtest
      ARKD_WALLET_NBXPLORER_URL: http://iso_rt_nbxplorer:32838
    volumes:
      - iso_rt_arkd_wallet_data:/app/data
    networks: [iso_rt_net]

  iso_rt_arkd_signer:
    image: ghcr.io/arkade-os/arkd-signer:v0.9.25
    container_name: iso_rt_arkd_signer
    labels: *owner
    restart: on-failure
    expose: ["6061"]
    environment:
      ARKD_SIGNER_PORT: "6061"
      ARKD_SIGNER_SECRET_KEY: ${ISO_RT_ARKD_SIGNER_KEY:?set ISO_RT_ARKD_SIGNER_KEY}
    networks: [iso_rt_net]

  iso_rt_arkd:
    image: ghcr.io/arkade-os/arkd:v0.9.25
    container_name: iso_rt_arkd
    labels: *owner
    restart: on-failure
    depends_on:
      - iso_rt_bitcoin
      - iso_rt_postgres
      - iso_rt_redis
      - iso_rt_nbxplorer
      - iso_rt_mempool_api
      - iso_rt_arkd_wallet
      - iso_rt_arkd_signer
    environment:
      ARKD_NO_TLS: "true"
      ARKD_NO_MACAROONS: "true"
      ARKD_WALLET_ADDR: iso_rt_arkd_wallet:6060
      ARKD_SIGNER_ADDR: iso_rt_arkd_signer:6061
      ARKD_ESPLORA_URL: http://iso_rt_mempool_api:8999/api
      ARKD_DB_TYPE: postgres
      ARKD_EVENT_DB_TYPE: postgres
      ARKD_PG_DB_URL: "postgresql://postgres@iso_rt_postgres:5432/projection?sslmode=disable"
      ARKD_PG_EVENT_DB_URL: "postgresql://postgres@iso_rt_postgres:5432/event?sslmode=disable"
      ARKD_PG_DB_AUTOCREATE: "true"
      ARKD_LIVE_STORE_TYPE: redis
      ARKD_REDIS_URL: redis://iso_rt_redis:6379/0
      ARKD_UNLOCKER_TYPE: env
      ARKD_UNLOCKER_PASSWORD: ${ISO_RT_ARKD_WALLET_PASS:?set ISO_RT_ARKD_WALLET_PASS}
      ARKD_SCHEDULER_TYPE: block
      ARKD_VTXO_MIN_AMOUNT: "1"
      ARKD_ROUND_MIN_PARTICIPANTS_COUNT: "1"
      ARKD_SESSION_DURATION: "10"
      ARKD_UNILATERAL_EXIT_DELAY: "20"
      ARKD_PUBLIC_UNILATERAL_EXIT_DELAY: "20"
      ARKD_BOARDING_EXIT_DELAY: "30"
      ARKD_CHECKPOINT_EXIT_DELAY: "10"
      ARKD_VTXO_TREE_EXPIRY: "480"
      ARKD_UNROLLED_VTXO_MIN_EXPIRY_MARGIN: "10"
    ports:
      - "127.0.0.1:${ISO_RT_ARKD_PORT:-47070}:7070"
      - "127.0.0.1:${ISO_RT_ARKD_ADMIN_PORT:-47071}:7071"
    volumes:
      - iso_rt_arkd_data:/app/data
      - ${ISO_RT_RUNTIME_DIR:?set ISO_RT_RUNTIME_DIR}/ark/wallets:/data
    networks: [iso_rt_net, iso_rt_host_net]

  iso_rt_elements:
    build:
      context: .
      dockerfile: Dockerfile.elements
    image: swap-engine-iso-regtest-elements:23.3.4
    container_name: iso_rt_elements
    labels: *owner
    restart: on-failure
    stop_grace_period: 30s
    command:
      - -datadir=/root/.elements
      - -chain=elementsregtest
      - -initialfreecoins=2100000000000000
      - -anyonecanspendaremine=1
      - -con_connect_genesis_outputs=1
      - -con_blocksubsidy=0
      - -txindex=1
      - -validatepegin=0
      - -fallbackfee=0.0001
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=7052
      - -listen=0
    ports:
      - "127.0.0.1:${ISO_RT_ELEMENTS_RPC_PORT:-47052}:7052"
    volumes:
      - ${ISO_RT_RUNTIME_DIR:?set ISO_RT_RUNTIME_DIR}/elements:/root/.elements
    networks: [iso_rt_net, iso_rt_host_net]

networks:
  iso_rt_net:
    name: iso_rt_net
    internal: true
    labels: *owner
  iso_rt_host_net:
    name: iso_rt_host_net
    driver: bridge
    labels: *owner

volumes:
  iso_rt_postgres_data:
    name: iso_rt_postgres_data
    labels: *owner
  iso_rt_nbxplorer_data:
    name: iso_rt_nbxplorer_data
    labels: *owner
  iso_rt_fulcrum_data:
    name: iso_rt_fulcrum_data
    labels: *owner
  iso_rt_mempool_cache:
    name: iso_rt_mempool_cache
    labels: *owner
  iso_rt_arkd_wallet_data:
    name: iso_rt_arkd_wallet_data
    labels: *owner
  iso_rt_arkd_data:
    name: iso_rt_arkd_data
    labels: *owner
